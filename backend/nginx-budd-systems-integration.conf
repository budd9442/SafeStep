# SafeStep API Integration for budd.systems
# Add this to your existing nginx configuration

# Upstream for SafeStep API
upstream safestep_api {
    server 127.0.0.1:3000;
}

# Rate limiting zone for SafeStep API
limit_req_zone $binary_remote_addr zone=safestep_api:10m rate=10r/s;

# Add these location blocks to your existing server block (inside the HTTPS server block)

# SafeStep API routes
location /api/ {
    limit_req zone=safestep_api burst=20 nodelay;
    
    proxy_pass http://safestep_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    
    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}

# SafeStep health check
location /health {
    proxy_pass http://safestep_api/api/health;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# mSpace webhook for delivery reports
location /mspace/ {
    proxy_pass http://safestep_api/api/mspace/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
} 
version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://safestep:safestep123@postgres:5432/safestep_db
      - JWT_SECRET=your_super_secret_jwt_key_here_change_in_production
      - JWT_EXPIRES_IN=7d
      - MSPACE_BASE_URL=https://api.mspace.lk
      - MSPACE_APPLICATION_ID=APP_008956
      - MSPACE_PASSWORD=bab3f431230a12998b0b72296642a5f6
      - MSPACE_VERSION=2.0
      - MSPACE_APPLICATION_HASH=safestep_hash
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - safestep-network

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=safestep_db
      - POSTGRES_USER=safestep
      - POSTGRES_PASSWORD=safestep123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - safestep-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - safestep-network

volumes:
  postgres_data:
  redis_data:

networks:
  safestep-network:
    driver: bridge 